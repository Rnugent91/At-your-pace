# /etc/nginx/sites-available/quotes  (then: ln -s ../sites-available/quotes /etc/nginx/sites-enabled/)
# certbot --nginx -d quotes.quackport.com adds the HTTPS server block.
server {
    listen 80;
    server_name quotes.quackport.com;

    client_max_body_size 5m;          # pasted booking pages

    location / {
        proxy_pass http://127.0.0.1:5055;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;      # PDF rendering
    }

    # Quotes are private: keep them out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;
}
