<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Quotes{% endblock %} · {{ settings.business_name }}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="top">
    <a class="brand" href="/search">{{ settings.business_name }}<small>Quote Builder</small></a>
    <nav class="row">
      <a href="/search">Search sailings</a>
      <a href="/quotes">Quotes</a>
      <a class="btn" href="/quotes/new">New quote</a>
    </nav>
  </header>
  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
